name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v jq > /dev/null; then
            if command -v sudo > /dev/null; then
              sudo apt-get update && sudo apt-get install -y jq
            else
              apt-get update && apt-get install -y jq
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not found. Installing SDK..."
            mkdir -p $HOME/android-sdk/cmdline-tools
            cd $HOME/android-sdk/cmdline-tools
          
            curl -L -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q sdk.zip
            mv cmdline-tools latest
          
            export ANDROID_HOME=$HOME/android-sdk
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
            echo "y" | tee -a - > /dev/null 
            (yes || true) | sdkmanager --licenses || true
          
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          else
            echo "Android SDK already available at $ANDROID_HOME"
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create and Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          
          echo "Processing release for $TAG_NAME on ${{ github.api_url }}"
          
          # Forgejo and GitHub both support this API structure
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/$TAG_NAME" | jq -r .id)
          
          if [ "$RELEASE_ID" == "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Creating new release..."
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"$TAG_NAME\"}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases" | jq -r .id)
          fi
          
          UPLOAD_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases/$RELEASE_ID/assets"
          
          echo "Uploading $APK_NAME to $UPLOAD_URL"
          
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK_PATH" \
            "$UPLOAD_URL?name=$APK_NAME"